<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#e9f6fb">
    <title>日文大會考｜每日練習</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <div class="ambient ambient-one" aria-hidden="true"></div>
        <div class="ambient ambient-two" aria-hidden="true"></div>

        <div class="app-card">
            <header class="brand-bar">
                <div class="brand-mark" aria-hidden="true">あ</div>
                <div class="brand-name">NIHONGO <span>NOTE</span></div>
                <span class="brand-pill">日本語練習帳</span>
            </header>

            <section id="start-screen" class="screen start-screen" aria-labelledby="start-title">
                <div class="hero-illustration" aria-hidden="true">
                    <span class="hero-sun"></span>
                    <span class="hero-page page-back"></span>
                    <span class="hero-page page-front"><span>あ</span><span>い</span><span>う</span></span>
                    <span class="hero-pencil"></span>
                    <span class="hero-star star-left">✦</span>
                    <span class="hero-star star-right">✧</span>
                </div>
                <p class="eyebrow">A LITTLE PRACTICE, EVERY DAY</p>
                <h1 id="start-title">日文大會考<span class="title-dot">。</span></h1>
                <p class="subtitle">挑個等級，來一場輕鬆的日文練習吧！</p>

                <div class="info-strip" aria-label="測驗資訊">
                    <span><strong>20</strong> 題隨機出題</span>
                    <span class="info-divider" aria-hidden="true"></span>
                    <span>每題 <strong>5</strong> 分</span>
                    <span class="info-divider" aria-hidden="true"></span>
                    <span>滿分 <strong>100</strong> 分</span>
                </div>

                <div class="setup-panel">
                    <label class="field-label" for="username">你的名字</label>
                    <input type="text" id="username" class="name-input" placeholder="輸入名字或暱稱" maxlength="30" autocomplete="nickname">

                    <fieldset class="level-fieldset">
                        <legend class="field-label">選擇挑戰等級</legend>
                        <div class="level-grid">
                            <label class="level-choice">
                                <input type="radio" name="level" value="ALL" checked>
                                <span class="level-card"><strong>混合</strong><small>N4 + N3</small></span>
                            </label>
                            <label class="level-choice">
                                <input type="radio" name="level" value="N4">
                                <span class="level-card"><strong>N4</strong><small>基礎練習</small></span>
                            </label>
                            <label class="level-choice">
                                <input type="radio" name="level" value="N3">
                                <span class="level-card"><strong>N3</strong><small>進階挑戰</small></span>
                            </label>
                        </div>
                    </fieldset>

                    <button id="start-btn" class="button button-primary" type="button">開始挑戰 <span aria-hidden="true">→</span></button>
                    <button id="review-btn" class="button button-secondary hide" type="button">複習歷史錯題 <span id="wrong-count" class="count-badge">0</span></button>
                    <p id="start-error" class="form-error hide" role="alert">先輸入名字，再開始挑戰喔！</p>
                </div>
            </section>

            <section id="game-screen" class="screen game-screen hide" aria-labelledby="question">
                <div class="game-topline">
                    <span id="mode-label" class="mode-chip">混合挑戰</span>
                    <span id="score-text" class="current-score">目前 0 分</span>
                </div>
                <div class="progress-row">
                    <span id="progress-text">第 1 / 20 題</span>
                    <span id="progress-percent">5%</span>
                </div>
                <div id="progress-track" class="progress-track" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="20" aria-valuenow="1">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>

                <div class="question-card">
                    <div class="question-heading"><span class="question-icon" aria-hidden="true">文</span><span>選出正確答案</span></div>
                    <h2 id="question">題目會顯示在這裡</h2>
                    <div id="answer-buttons" class="answer-grid" role="group" aria-label="答案選項"></div>
                    <div id="answer-feedback" class="answer-feedback hide" role="status" aria-live="polite"></div>
                </div>

                <button id="submit-btn" class="button button-primary" type="button" disabled>確認答案</button>
                <button id="next-btn" class="button button-primary hide" type="button">下一題 <span aria-hidden="true">→</span></button>
            </section>

            <section id="result-screen" class="screen result-screen hide" aria-labelledby="result-title">
                <div class="result-medal" aria-hidden="true">✦</div>
                <p class="eyebrow">PRACTICE COMPLETE</p>
                <h2 id="result-title">練習完成！</h2>
                <p id="result-message" class="subtitle">今天也向前進步了一點。</p>
                <div class="score-panel">
                    <div class="score-circle"><span id="final-score">0</span><small id="score-total">/ 100 分</small></div>
                    <div class="score-summary">
                        <div><strong id="correct-count">0</strong><span>答對題數</span></div>
                        <div><strong id="result-wrong-count">0</strong><span>待複習</span></div>
                    </div>
                </div>
                <div id="review-container" class="review-container hide">
                    <div class="review-heading"><h3>錯題筆記</h3><span>下次再試一次！</span></div>
                    <ul id="review-list"></ul>
                </div>
                <div id="perfect-score-img" class="perfect-message hide">全部答對，太厲害了！ ✨</div>
                <button id="restart-btn" class="button button-primary" type="button">返回首頁 <span aria-hidden="true">→</span></button>
            </section>

            <footer class="app-footer"><span>一題一題，慢慢變厲害。</span><span>がんばってね ✦</span></footer>
        </div>
    </main>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>
</html>
